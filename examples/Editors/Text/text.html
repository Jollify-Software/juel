<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Text — Juel Examples</title>
    <script src="../../../dist/juel.js"></script>
    <link rel="stylesheet" href="../../_Shared/examples.css" />
</head>

<body>
    <juel-embed type="html" url="../../_Shared/header.html"></juel-embed>

    <header class="example-header">
        <h1>Text</h1>
        <p>
            <code>&lt;juel-text label="..." value="..."&gt;</code> is a labelled single-line text
            input. It fires <code>value-changed</code> as you type.
        </p>
    </header>

    <section class="example-section">
        <h2>Basic</h2>
        <div class="example-demo example-demo-column">
            <juel-text label="Name" value="Ada Lovelace"></juel-text>
            <juel-text label="Email"></juel-text>
        </div>
    </section>
</body>

</html>
