<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Number — Juel Examples</title>
    <script src="../../../dist/juel.js"></script>
    <link rel="stylesheet" href="../../_Shared/examples.css" />
</head>

<body>
    <juel-embed type="html" url="../../_Shared/header.html"></juel-embed>

    <header class="example-header">
        <h1>Number</h1>
        <p>
            <code>&lt;juel-number label="..." value="..."&gt;</code> is a labelled
            <code>type="number"</code> input. Fires <code>value-changed</code> with the parsed
            numeric value as you type.
        </p>
    </header>

    <section class="example-section">
        <h2>Basic</h2>
        <div class="example-demo">
            <juel-number label="Quantity" value="1"></juel-number>
            <juel-number label="Age"></juel-number>
        </div>
    </section>
</body>

</html>
