<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>juel-icon-picker</title>
    <script src="../../../dist/juel.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
    </style>
</head>
<body>
    <h1>juel-icon-picker</h1>
    <p>Press the button, search, or use the arrow keys. It works inside a modal dialog too, because the grid is a native popover.</p>
    <juel-icon-picker id="picker" label="Icon"></juel-icon-picker>
    <p>Value: <output id="value"></output></p>
    <p><button id="open-dialog" type="button">In a dialog</button></p>
    <dialog id="dialog"><juel-icon-picker id="in-dialog" label="Icon" value="lucide-rocket"></juel-icon-picker></dialog>
    <script>
        customElements.whenDefined('juel-icon-picker').then(() => {
            document.getElementById('picker').addEventListener('value-changed', e => { document.getElementById('value').textContent = e.detail.value; });
            document.getElementById('open-dialog').addEventListener('click', () => document.getElementById('dialog').showModal());
            window.exampleReady = true;
        });
    </script>
</body>
</html>
