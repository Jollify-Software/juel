<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Splitter — Juel Examples</title>
    <script src="../../../dist/juel.js"></script>
    <link rel="stylesheet" href="../../_Shared/examples.css" />
    <style>
        juel-splitter {
            height: 260px;
            border: 1px solid var(--border-color, #dee2e6);
            border-radius: 4px;
        }
        juel-splitter > div {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            font-weight: bold;
        }
        .pane-a { background: var(--primary, #007bff); color: #fff; }
        .pane-b { background: var(--success, #28a745); color: #fff; }
        .pane-c { background: var(--warning, #ffc107); }
    </style>
</head>

<body>
    <juel-embed type="html" url="../../_Shared/header.html"></juel-embed>

    <header class="example-header">
        <h1>Splitter</h1>
        <p>
            <code>&lt;juel-splitter&gt;</code> arranges its light-DOM children as resizable panes,
            separated by a draggable gutter. Set <code>vertical</code> to stack panes top-to-bottom
            instead of side-by-side.
        </p>
    </header>

    <section class="example-section">
        <h2>Horizontal</h2>
        <div class="example-demo">
            <juel-splitter>
                <div class="pane-a">Pane A</div>
                <div class="pane-b">Pane B</div>
            </juel-splitter>
        </div>
    </section>

    <section class="example-section">
        <h2>Vertical, three panes</h2>
        <div class="example-demo">
            <juel-splitter vertical>
                <div class="pane-a">Top</div>
                <div class="pane-b">Middle</div>
                <div class="pane-c">Bottom</div>
            </juel-splitter>
        </div>
    </section>
</body>

</html>
