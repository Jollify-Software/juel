<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Draggable — Juel Examples</title>
    <script src="../../../dist/juel.js"></script>
    <link rel="stylesheet" href="../../_Shared/examples.css" />
    <style>
        .drag-area {
            position: relative;
            width: 100%;
            height: 220px;
            border: 1px dashed #ccc;
            border-radius: 4px;
            overflow: hidden;
        }
        .caption {
            display: inline-block;
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            background: var(--primary, #007bff);
            color: #fff;
            border-radius: 4px;
            cursor: grab;
            touch-action: none;
            user-select: none;
        }
    </style>
</head>

<body>
    <a class="example-back" href="../../index.html">&larr; All examples</a>

    <header class="example-header">
        <h1>Draggable</h1>
        <p>
            <code>&lt;juel-draggable&gt;</code> makes its slotted children draggable via
            <a href="https://interactjs.io/">interact.js</a> — drag any of the boxes below around.
        </p>
    </header>

    <section class="example-section">
        <h2>Basic</h2>
        <p>Each slotted child becomes independently draggable.</p>
        <div class="example-demo">
            <div class="drag-area">
                <juel-draggable>
                    <div class="caption">Dolphin 🐬</div>
                    <div class="caption">Whale 🐋</div>
                    <div class="caption">Squid 🦑</div>
                    <div class="caption">Snail 🐌</div>
                </juel-draggable>
            </div>
        </div>
    </section>
</body>

</html>
