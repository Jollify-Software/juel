<html>

<head>
    <script src="../../../dist/juel.js"></script>
</head>
<body>
    <juel-card>
        <div slot="header">Card Title</div>
      
        <p>This is some card content in the body. It can include any HTML or other components.</p>
      
        <div slot="footer">
          <button>OK</button>
        </div>
      </juel-card>


    <juel-card>
            <img slot="image" src="https://upload.wikimedia.org/wikipedia/en/a/ae/Flag_of_the_United_Kingdom.svg">
        <h5 slot="header">Card title</h5>
        <p>
            Some quick example text to build on the card title and make up the bulk of the card's content.
        </p>
        <juel-button label="Hello there"></juel-button>
    </juel-card>
    <style>
        /* A tile through the card's parts: stretched to its cell, no header or footer. */
        #tile { display: block; width: 220px; }
        #tile::part(card) { display: flex; height: 100%; border-color: #3b6fd8; }
        #tile::part(header), #tile::part(footer) { display: none; }
        #tile::part(body) { padding: 8px 10px; }
    </style>
    <juel-card id="tile">
        <p>A tile: only the body, in a blue box.</p>
    </juel-card>
</body>
</html>
