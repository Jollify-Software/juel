name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      # `npm run build` uses cmd's `del`; call Parcel directly instead.
      - name: Build
        run: npx parcel build juel.ts

      - name: Check the bundle exists
        run: test -s dist/juel.js

      - name: Unit tests
        run: npx jest

      # Playwright in the runner's installed Google Chrome (channel: 'chrome').
      - name: Browser tests
        run: npm run test:browser

      # The HTML report (written in CI only, playwright.config.ts) when a browser test fails.
      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
